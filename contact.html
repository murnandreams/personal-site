<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="shortcut icon" href="favicon.ico">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="index.html">DM<span>.</span></a>
    <nav class="site-nav" aria-label="Site">
      <a href="index.html">CV</a>
      <a href="hobbies.html">Hobbies</a>
      <a href="poetry.html">Poetry</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main class="page">
    <header class="page-header">
      <span class="eyebrow">Get in touch</span>
      <h1>Contact Me</h1>
      <p>Open to new opportunities, collaborations and a good chat about software.</p>
    </header>

    <div class="contact-grid">
      <section class="contact-card">
        <h2>Email</h2>
        <p><a href="mailto:devin.murnan@gmail.com">devin.murnan@gmail.com</a></p>
        <p>I usually reply within a couple of days.</p>
      </section>

      <form class="contact-form" enctype="text/plain" action="mailto:devin.murnan@gmail.com" method="post">
        <label for="your-name">Your name</label>
        <input type="text" id="your-name" name="YourName" autocomplete="name" required>
        <label for="your-email">Your email</label>
        <input type="email" id="your-email" name="YourEmail" autocomplete="email" required>
        <label for="your-message">Your message</label>
        <textarea id="your-message" name="YourMessage" rows="7" required></textarea>
        <input type="submit" name="Submit" value="Send message">
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p>© Devin Murnan · Hand-built with HTML &amp; CSS</p>
  </footer>
</body>

</html>
